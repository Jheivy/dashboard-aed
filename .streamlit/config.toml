[server]
maxUploadSize = 2000
headless = false
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[runner]
fastReruns = true

# --------------------------------------------------------------------------- #
# Sistema de diseño: tipografía, radios y paletas validadas (claro + oscuro).
# La app sigue la preferencia del sistema; se puede cambiar en Ajustes.
# --------------------------------------------------------------------------- #
[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap, monospace"
baseFontSize = 15
baseRadius = "0.6rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true
headingFontWeights = [700, 650, 600, 600, 600, 600]
headingFontSizes = ["1.85rem", "1.35rem", "1.1rem", "1rem", "0.95rem", "0.9rem"]

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#f7f8fa"
secondaryBackgroundColor = "#eef1f5"
textColor = "#111827"
borderColor = "#e2e6ec"
linkColor = "#1c5cab"
dataframeHeaderBackgroundColor = "#f3f5f8"
codeBackgroundColor = "#f1f3f6"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]
chartSequentialColors = ["#cde2fb", "#b7d3f6", "#9ec5f4", "#86b6ef", "#6da7ec", "#3987e5", "#2a78d6", "#256abf", "#184f95", "#0d366b"]

[theme.light.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f5f8"
borderColor = "#e2e6ec"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#0f1115"
secondaryBackgroundColor = "#1b1f27"
textColor = "#e6e8ec"
borderColor = "#272c36"
linkColor = "#86b6ef"
dataframeHeaderBackgroundColor = "#1b1f27"
codeBackgroundColor = "#1b1f27"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]
chartSequentialColors = ["#0d366b", "#104281", "#184f95", "#1c5cab", "#256abf", "#2a78d6", "#3987e5", "#5598e7", "#86b6ef", "#b7d3f6"]

[theme.dark.sidebar]
backgroundColor = "#14171d"
secondaryBackgroundColor = "#1b1f27"
borderColor = "#272c36"
